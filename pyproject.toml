[project]
name = "sga"
version = "0.1.0"
description = "Seasonal Guild Aggregator: Warcraft Logs raid reports to season stats"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "polars>=1.30",
    "python-dotenv>=1.1",
]

[project.scripts]
sga = "sga.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # pep8 naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PIE",     # misc lints
    "RET",     # return statements
    "PT",      # pytest style
    "PTH",     # pathlib over os.path
    "RUF",     # ruff-specific
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic characters (– × →) are intentional
]

[tool.ruff.lint.per-file-ignores]
# Slide layouts are single-line HTML templates
"src/sga/slides.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
