# The whole deck: its title and every slide in order with all of its text.
# Layouts and their keys, the data names and their values: src/sga/slides.py and docs/design.md.
# {placeholders} come from the slide's `data` plus the season values available to every slide:
#   season nights pulls kills wipes deaths regulars combat_hours wipe_hours wipe_share
#   combat_hours_exact wipe_hours_exact
#   first_night last_night regular_threshold
# Text that depends on the numbers is a table of variants keyed by the data's case.
# stat_row items and awards cards may name their own `data`; one without data is dropped.
# Player awards put the winner big (big_name, awards); guild and boss stats the number.
# Every tied winner is shown; a punchline names the runner-up, a contrast or a joke.
# Keep the teasing friendly: set enabled = false on any award that could sting.

title = "{season}"

# --- Intro ------------------------------------------------------------------------------

[[slides]]
id = "cover"
layout = "cover"
data = "none"
kicker = "Luckydo's Season In Review"
title = "{season}"
subtitle = "{first_night} – {last_night} · {nights} raid nights"
notes = "Numbers as of {last_night}. Every pull merges all uploaded copies of it."

[[slides]]
id = "at-a-glance"
layout = "stat_row"
data = "none"
kicker = "Season at a Glance"
title = "{nights} raid nights in {season}"
items = [
  { value = "{pulls}", label = "boss pulls" },
  { value = "{kills}", label = "kills" },
  { value = "{wipes}", label = "wipes" },
  { value = "{combat_hours} h", label = "boss combat" },
]
punchline = ""
notes = "Pulls: boss encounters in {season}, any difficulty, after merging duplicate logs. Combat time {combat_hours_exact} h, of which {wipe_hours_exact} h on wipes."

[[slides]]
id = "hours-lost"
layout = "big_number"
data = "none"
kicker = "Time Well Spent"
number = "{wipe_hours} h"
title = "of boss combat ended in a wipe"
punchline = "That's {wipe_share} of all boss time."
notes = "Sum of wipe durations: {wipe_hours_exact} h of {combat_hours_exact} h total."

# --- Bosses -----------------------------------------------------------------------------

[[slides]]
id = "progression"
layout = "table"
data = "progression"
kicker = "Progression"
title = "How the bosses fell"
header = ["Boss", "Difficulty", "First kill", "Pulls to kill", "Total pulls"]
row = { killed = ["{boss}", "{difficulty}", "{first_kill}", "{pulls_to_kill}", "{total_pulls}"], not_killed = ["{boss}", "{difficulty}", "Not yet", "–", "best {best_pct}"] }
punchline = ""
notes = "Each boss at the highest difficulty attempted. Pulls to kill counts pulls up to and including the first kill."

[[slides]]
id = "hall-of-wipes"
layout = "awards"
data = "none"
kicker = "Deaths"
title = "Hall of Wipes"
punchline = ""
notes = ""
cards = [
  { data = "speedrun", kicker = "Speedrun", winner = "{duration}", stat = "until the wipe on {where}", punchline = "Next: {next_where}, {next_duration}", notes = "Shortest wipe: pull {pull_id}, {seconds} s." },
  { data = "fastest_death", kicker = "Speedrun (New PB)", winner = "{player}", stat = "dead {seconds} s into the pull", punchline = "vs {how}", notes = "Fastest death from pull start, excluding deaths after the wipe call: {detail}. Next: {next}, {next_seconds} s." },
  { data = "so_close", kicker = "So Close", winner = "{boss_pct}", stat = "health left on {where}", punchline = "Next: {next_where}, {next_boss_pct}", notes = "Lowest boss health on any wipe. Next closest: {next_closest}" },
]

[[slides]]
id = "killing-blow"
layout = "big_number"
data = "killing_blow"
kicker = "Top Killer"
number = "{deaths}"
title = "deaths to {ability}"
punchline = "Tank issue."
notes = "Abilities credited with the most killing blows, on {bosses}. Next: {next}"

[[slides]]
id = "toughest-night"
layout = "big_number"
data = "toughest_night"
kicker = "The Toughest Night"
number = "{deaths}"
title = { one = "deaths on {night}: {pulls} pulls, {kills} kills", tied = "deaths on each of {night}" }
punchline = "Nights with zero kills: {zero_kill_nights}."
notes = "Deaths include those after the wipe call."

[[slides]]
id = "kills"
layout = "stat_row"
data = "none"
kicker = "Kills"
title = "Not all kills are equal"
punchline = ""
notes = "Deaths on each kill across all merged copies, including after the boss died."
items = [
  { data = "cleanest_kills", kicker = "Flawless", value = "{clean}", label = "of {kills} kills where nobody died" },
  { data = "ugliest_kill", kicker = "A Kill Is a Kill", value = "{deaths}", label = "deaths on the {where} kill" },
]

# --- Awards -----------------------------------------------------------------------------

[[slides]]
id = "first-and-last"
layout = "awards"
data = "none"
kicker = "Awards"
title = "First Down, Last Standing"
punchline = ""
notes = "Regulars only."
cards = [
  { data = "floor_award", kicker = "Floor Inspector", winner = "{player}", stat = "first to die on {first_deaths} pulls", punchline = "Highest rate: {rate_player}, first down on {rate} of pulls.", notes = "First death of the pull, excluding deaths after the wipe call. Next: {next}, {next_first_deaths}." },
  { data = "cockroach", kicker = "The Cockroach", winner = "{player}", stat = "still standing at the end of {survived} wipes", punchline = "Next: {next}, {next_survived}", notes = "Wipes where the player never died, not even after the wipe call; the winner survived {rate} of their {wipes} wipes. Pulls played as a Holy Priest are left out: Spirit of Redemption hides their deaths." },
]

[[slides]]
id = "support-crew"
layout = "awards"
data = "none"
kicker = "Awards"
title = "The Support Crew"
punchline = ""
notes = "Summed over boss pulls; regulars only."
cards = [
  { data = "interrupts", kicker = "Interrupt Hero", winner = "{player}", stat = "{interrupts} interrupts", punchline = "Next: {next}, {next_interrupts}", notes = "Successful interrupts of enemy casts." },
  { data = "dispels", kicker = "The Cleanser", winner = "{player}", stat = "{dispels} dispels", punchline = "Next: {next}, {next_dispels}", notes = "Dispels of harmful effects." },
  { data = "rezzes_given", kicker = "Combat Medic", winner = "{player}", stat = "{rezzes_given} battle rezzes cast", punchline = "Next: {next}, {next_rezzes_given}", notes = "Rebirth, Raise Ally and Intercession; a Soulstone resurrection counts for the player rezzed, not the warlock." },
  { data = "rezzes_received", kicker = "The Zombie", winner = "{player}", stat = "brought back {rezzes_received} times", punchline = "Next: {next}, {next_rezzes_received}", notes = "Battle rezzes received, Soulstones included." },
]

[[slides]]
id = "wined-and-dined"
layout = "awards"
data = "consumables"
kicker = "Awards"
title = "Wined and Dined"
punchline = "Potion Seller, I am going into battle and I want your strongest potions."
notes = { some_never = "Potion and healthstone casts during boss pulls; regulars only. Never pressed a potion or healthstone: {never}.", all_pressed = "Potion and healthstone casts during boss pulls; regulars only. Everyone pressed something." }
cards = [
  { data = "consumables", kicker = "Drinking Problem", winner = "{player}", stat = "drank {potions} potions", punchline = "Next: {next}, {next_potions}", notes = "" },
  { data = "cookie_monster", kicker = "Cookie Monster", winner = "{player}", stat = "ate {healthstones} healthstones", punchline = "Next: {next}, {next_healthstones}", notes = "{per_pull} healthstones per pull for the winner, across {pulls} pulls." },
]

[[slides]]
id = "damage-taken"
layout = "stat_row"
data = "none"
kicker = "Awards"
title = "Damage Taken"
punchline = ""
notes = "Regulars only. Avoidable: damage from abilities marked avoidable in season.toml, per pull attended; boss melee and tank hits count only for players not tanking that pull. Honorary Tank: most damage taken across the season on pulls where the player wasn't tanking."
items = [
  { data = "avoidable", kicker = "Puddle Parser", value = "{player}", label = "{per_pull} avoidable damage per pull" },
  { data = "avoidable", kicker = "Agile Andy", value = "{clean_player}", label = "{clean_per_pull} avoidable damage per pull" },
  { data = "damage_sponge", kicker = "Honorary Tank", value = "{player}", label = "took {damage_taken} damage without tanking" },
]

[[slides]]
id = "above-and-beyond"
layout = "awards"
data = "none"
kicker = "Awards"
title = "Above and Beyond"
punchline = ""
notes = "Regulars only."
cards = [
  { data = "attendance", kicker = "Perfect Attendance", winner = "{player}", stat = { perfect = "present for all {total} pulls", top = "present for {attended} of {total} pulls" }, punchline = "Next: {next}, {next_attended}", notes = "Pulls attended counts any merged copy showing the character in the pull. Left out: {resets} likely resets, wipes under 30 s, where players who did nothing aren't logged." },
  { data = "janitor", kicker = "The Janitor", winner = "{player}", stat = "dealt {trash_damage} damage to trash", punchline = "Somebody has to clean up.", notes = "Damage done to raid trash, on the {nights_with_trash} of {nights} nights where someone logged trash; each night takes the fullest uploader's logs. Next: {next}, {next_trash_damage}." },
  { data = "lustiest", kicker = "The Lustful Raider", winner = "{player}", stat = "{lusts} of the {pulls_with_lust} pulls with a lust", punchline = "Next: {next}, {next_lusts}", notes = "Who cast the first Bloodlust/Heroism/Time Warp/Primal Rage/Fury of the Aspects of each pull. Typical first lust: {median} s into the pull (average {mean} s)." },
]

[[slides]]
id = "jack-of-all-trades"
layout = "podium"
data = "jack_of_all_trades"
kicker = "Awards"
title = "Jack of All Trades"
row = ["{player}", "{roles} roles, {specs} specs"]
punchline = "Stuck to one spec all season: {one_spec} regulars."
notes = "Ranked by roles played, then specs, on boss pulls; tied players share a place. {spec_list}. Regulars only."

[[slides]]
id = "gear-check"
layout = "awards"
data = "none"
kicker = "Awards"
title = "Gear Check"
punchline = ""
notes = "Regulars only. Each boss pull compares a player's equipped item level with the median of everyone in that pull, then averages over their pulls, so joining late in the season doesn't count as being geared."
cards = [
  { data = "least_geared", kicker = "Dead Weight", winner = "{player}", stat = "{vs_raid} the raid", punchline = "Next: {next}, {next_vs_raid}", notes = "Average item level {item_level}." },
  { data = "most_geared", kicker = "All The Gear, No Idea", winner = "{player}", stat = "{vs_raid} the raid", punchline = "Next: {next}, {next_vs_raid}", notes = "Average item level {item_level}." },
]

# --- The Meters -------------------------------------------------------------------------

[[slides]]
id = "damage-healing"
layout = "stat_row"
data = "damage_healing"
kicker = "The Meters"
title = "The guild's season output"
punchline = ""
notes = "Damage {damage_exact}; healing {healing_exact}. Per-player maxes across copies."
items = [
  { value = "{damage}", label = "damage done" },
  { value = "{healing}", label = "healing done" },
]

[[slides]]
id = "dps-board"
layout = "leaderboard"
data = "dps_board"
kicker = "The Meters"
title = "Top Relative DPS"
row = ["{player}", "{spec}", "{value}"]
punchline = ""
notes = "On each kill, a regular's DPS against the median DPS player on that same kill (100% = typical), averaged over the kills they played as DPS, then weighted as if they had 10 more kills at the DPS average. Labelled by the spec they played most. Average DPS, kills and unweighted score: {details}."

[[slides]]
id = "hps-board"
layout = "leaderboard"
data = "hps_board"
kicker = "The Meters"
title = "Top Relative HPS"
row = ["{player}", "{spec}", "{value}"]
punchline = ""
notes = "On each kill, a regular's HPS against the median healer on that same kill (100% = typical), averaged over the kills they played as a healer or tank (one row per role), then weighted as if they had 10 more kills at their role's average. Labelled by the spec they played most. Average HPS, kills and unweighted score: {details}."

# --- Outro ------------------------------------------------------------------------------

[[slides]]
id = "closing"
layout = "cover"
data = "none"
kicker = ""
title = "See you next tier!"
subtitle = ""
github = "https://github.com/CameronWragg/warcraftlogs-sga"
notes = """How this was counted: every boss pull in the raid at any difficulty; trash counts only \
for The Janitor; dungeons and Mythic+ left out. Pulls logged by several people are merged: the \
highest value per player per metric, never added together. Wipe call: Warcraft Logs' own call \
time, else 10 seconds before the wipe ended; deaths after it don't count for first-to-die. \
Awards go to regulars: anyone at {regular_threshold}+ of pulls. Source data: the season's gold \
ledgers (pulls.csv, player_pulls.csv) and stats.json."""
